name: daily-crypto-prices
on:
  schedule:
    - cron: "30 16 * * *"    # 台灣時間每天 00:30(日K已收盤)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_prices.py
      - name: K 線資料
        if: always()
        run: python fetch_ohlc.py
      - name: 存檔
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json data/ohlc.json || true
          git diff --cached --quiet || (git commit -m "update crypto prices" && git push)
